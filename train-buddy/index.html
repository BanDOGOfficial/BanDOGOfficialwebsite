const key='bandog-train-buddy-v9';
let saved=JSON.parse(localStorage.getItem(key)||'null');
const s=saved||{xp:0,taps:0,streak:0,active:1};
const $=id=>document.getElementById(id);
function getLevelIndex(xp){
  // The displayed level is the stage being trained toward the next unlock.
  // Level 1: 0-99 XP -> unlock Puppy at 100.
  // Level 2: 100-299 XP -> unlock Young at 300, etc.
  let i=0;
  for(let n=1;n<ranks.length;n++) if(xp>=ranks[n-1].xp) i=n;
  return Math.min(i,ranks.length-1);
}
function getUnlockedCount(xp){let count=0;for(const r of ranks)if(xp>=r.xp)count++;return count}
function save(){localStorage.setItem(key,JSON.stringify(s))}
function renderInventory(){
 const wrap=$('buddies');wrap.innerHTML='';
 const unlocked=getUnlockedCount(s.xp);
 $('inventoryCount').textContent=unlocked+' / 5 UNLOCKED';
 ranks.forEach(r=>{
  const isUnlocked=r.level<=unlocked;
  const card=document.createElement('button');card.type='button';
  card.className='buddy-card '+(isUnlocked?'unlocked':'locked')+(s.active===r.level?' active':'');
  card.innerHTML=`<img src="${r.img}" alt="${isUnlocked?r.title:'Locked Buddy'}"><span class="lock">🔒</span><div class="card-lvl">LVL ${r.level}</div><div class="card-name">${r.name}</div>`;
  if(isUnlocked) card.onclick=()=>{s.active=r.level;save();render();};
  wrap.appendChild(card);
 });
}
function render(){
 const i=getLevelIndex(s.xp);
 const current=ranks[i];
 const next=current.xp;
 const prev=i===0?0:ranks[i-1].xp;
 const p=next>prev?Math.min(100,Math.max(0,(s.xp-prev)/(next-prev)*100)):100;
 $('level').textContent=current.level;
 $('xp').textContent=s.xp;$('taps').textContent=s.taps;$('streak').textContent=s.streak;
 $('rank').textContent=current.name;$('now').textContent=s.xp;$('next').textContent=next;$('bar').style.width=p+'%';
 $('m1').textContent=Math.min(10,s.taps)+'/10';$('m2').textContent=Math.min(50,s.taps)+'/50';
 const unlocked=getUnlockedCount(s.xp);
 const active=ranks[(s.active||1)-1]||ranks[0];
 $('buddy').classList.toggle('locked', active.level>unlocked);
 $('buddyImg').src=active.img;$('buddyImg').alt=active.level>unlocked?'Locked Buddy':active.title;$('buddyName').textContent=active.title;
 renderInventory();
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function showLevelUp(level){
 const r=ranks[level-1];
 $('levelupImg').src=r.img;$('levelupImg').alt=r.title;$('levelupTitle').textContent=r.title;
 $('levelupSub').textContent='LEVEL '+level+' UNLOCKED';
 $('levelup').classList.add('show');
}
$('levelupClose').onclick=()=>{$('levelup').classList.remove('show');render()};
$('levelup').addEventListener('click',e=>{if(e.target.id==='levelup')$('levelup').classList.remove('show')});
$('buddy').onclick=()=>{
 const beforeUnlocked=getUnlockedCount(s.xp);
 s.taps++;s.xp++;s.streak++;
 const afterUnlocked=getUnlockedCount(s.xp);
 if(afterUnlocked>beforeUnlocked){s.active=afterUnlocked;save();showLevelUp(afterUnlocked);}
 save();
 let f=$('float');f.textContent='+1 XP';f.classList.remove('show');void f.offsetWidth;f.classList.add('show');render();
};
$('reset').onclick=()=>{if(confirm('Reset your local score and lock the Buddies again?')){s.xp=0;s.taps=0;s.streak=0;s.active=1;save();render();toast('Progress reset');}};
render();
</script>

<style id="bandog-v15-daily">
/* V15 Daily System: UTC-based daily reset + permanent progression */
.stats,.progress{display:none !important;}
#stats-v15{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.stat15{background:rgba(255,255,255,.045);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:11px;min-width:0;}
.stat15 .label{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;}
.stat15 .main{font-size:18px;font-weight:800;margin-top:3px;color:#f2d27a;}
.stat15 .sub{font-size:11px;opacity:.65;margin-top:2px;} .coin-stat .main{color:#f2d27a;text-shadow:0 0 14px rgba(242,210,122,.18);}
#progress15{margin:10px 0 16px;padding:12px;border-radius:14px;background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.22);}
#progress15 .row{display:flex;justify-content:space-between;gap:8px;font-weight:800;}
#progress15 .row span:first-child{color:#f2d27a;}
#progress15 .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:8px;}
#progress15 .fill{height:100%;width:0%;background:linear-gradient(90deg,#8f6b18,#f0cf62);border-radius:99px;transition:width .2s;}
#progress15 .note{font-size:11px;opacity:.7;margin-top:6px;}
#dailyReset15{font-size:10px;opacity:.58;text-align:right;margin-top:7px;letter-spacing:.04em;}
@media(max-width:430px){#stats-v15{gap:8px}.stat15{padding:9px}.stat15 .main{font-size:16px}}
</style>
<script id="bandog-v15-daily-script">
(function(){
  const DAILY_KEY='bandog_daily_v15';
  const DAY_KEY='bandog_last_active_day_v15';
  const STREAK_KEY='bandog_daily_streak_v15';
  const BEST_KEY='bandog_best_streak_v15';
  const COINS_KEY='bandog_buddy_coins_v16';
  const $=id=>document.getElementById(id);
  const THRESHOLDS=[0,100,300,700,1200,2000];
  const NAMES=['PUPPY','YOUNG','ADULT','ALPHA','LEGENDARY'];

  // All daily boundaries use UTC, so every player shares the same reset time.
  function utcDay(){
    const d=new Date();
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  function utcPrevDay(){
    const d=new Date(); d.setUTCDate(d.getUTCDate()-1);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  function getDaily(){
    let d=null;
    try{d=JSON.parse(localStorage.getItem(DAILY_KEY)||'null')}catch(e){}
    const k=utcDay();
    if(!d || d.day!==k){
      d={day:k,xp:0,taps:0,m1Claimed:false,m2Claimed:false,streakRewardClaimed:false};
      localStorage.setItem(DAILY_KEY,JSON.stringify(d));
    }
    return d;
  }
  function getCoins(){return Number(localStorage.getItem(COINS_KEY)||0);}
  function addCoins(amount, message){
    const next=getCoins()+amount;
    localStorage.setItem(COINS_KEY,String(next));
    if(message && typeof toast==='function') toast('🪙 +'+amount+' Buddy Coins — '+message);
  }
  function streakReward(streak){
    const rewards={1:5,2:10,3:15,4:20,5:25,6:30,7:100};
    return rewards[streak]||0;
  }
  function getStage(xp){
    if(xp>=2000)return {name:'LEGENDARY',start:1200,end:2000,level:5};
    if(xp>=1200)return {name:'ALPHA',start:700,end:1200,level:4};
    if(xp>=700)return {name:'ADULT',start:300,end:700,level:3};
    if(xp>=300)return {name:'YOUNG',start:100,end:300,level:2};
    return {name:'PUPPY',start:0,end:100,level:1};
  }
  function getStreak(){return Number(localStorage.getItem(STREAK_KEY)||0);}
  function getBest(){return Number(localStorage.getItem(BEST_KEY)||0);}
  function registerDailyActivity(){
    const d=getDaily();
    const today=utcDay(), last=localStorage.getItem(DAY_KEY);
    let streak=getStreak();
    const firstActivityToday=last!==today;
    d.taps++; d.xp++;
    if(firstActivityToday){
      streak=(last===utcPrevDay()) ? streak+1 : 1;
      localStorage.setItem(DAY_KEY,today);
      localStorage.setItem(STREAK_KEY,String(streak));
      if(streak>getBest()) localStorage.setItem(BEST_KEY,String(streak));
      if(!d.streakRewardClaimed){
        const reward=streakReward(streak);
        if(reward){addCoins(reward,'Streak Day '+streak);}
        d.streakRewardClaimed=true;
      }
    }
    if(d.taps>=10 && !d.m1Claimed){
      d.m1Claimed=true;
      addCoins(10,'First Training complete');
    }
    if(d.taps>=50 && !d.m2Claimed){
      d.m2Claimed=true;
      addCoins(25,'Build the Streak complete');
    }
    localStorage.setItem(DAILY_KEY,JSON.stringify(d));
  }
  function nextReset(){
    const n=new Date();
    const next=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1,0,0,0));
    return Math.max(0,next.getTime()-n.getTime());
  }
  function fmt(ms){
    const total=Math.floor(ms/1000), h=Math.floor(total/3600), m=Math.floor((total%3600)/60), sec=total%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function build(){
    if($('stats-v15'))return;
    const stats=document.createElement('div');
    stats.id='stats-v15';
    stats.innerHTML=
      '<div class="stat15"><div class="label">XP Today</div><div class="main" id="v15-today-xp">0</div><div class="sub">Total: <span id="v15-total-xp">0</span> XP</div></div>'+
      '<div class="stat15"><div class="label">Taps Today</div><div class="main" id="v15-today-taps">0</div><div class="sub">Total: <span id="v15-total-taps">0</span></div></div>'+
      '<div class="stat15"><div class="label">Current Streak</div><div class="main" id="v15-current">🔥 0 days</div><div class="sub">Best: <span id="v15-best">0 days</span></div></div>'+
      '<div class="stat15 coin-stat"><div class="label">🪙 Buddy Coins</div><div class="main" id="v15-coins">0</div><div class="sub">In-game currency</div></div>';
    const progress=document.createElement('div');
    progress.id='progress15';
    progress.innerHTML='<div class="row"><span id="v15-name">PUPPY</span><span id="v15-progress">0 / 100 XP</span></div><div class="bar"><div class="fill" id="v15-fill"></div></div><div class="note" id="v15-note">100 XP to next unlock</div><div id="dailyReset15">Daily reset in <span id="v15-countdown">00:00:00</span> UTC</div>';
    const main=document.querySelector('main.game');
    const header=main ? main.querySelector('header') : null;
    const oldStats=document.querySelector('.stats');
    if(header) header.insertAdjacentElement('afterend',stats); else if(oldStats) oldStats.insertAdjacentElement('beforebegin',stats); else document.body.appendChild(stats);
    stats.insertAdjacentElement('afterend',progress);
    // Keep the original V10 stats/progress hidden; the V15 HUD is the only visible one.
    if(oldStats) oldStats.style.display='none';
  }
  function refresh(){
    if(typeof s==='undefined')return;
    build();
    const xp=Math.max(0,Number(s.xp)||0), taps=Math.max(0,Number(s.taps)||0);
    const d=getDaily(), stage=getStage(xp);
    $('level').textContent=stage.level;
    $('v15-today-xp').textContent=d.xp;
    $('v15-total-xp').textContent=xp;
    $('v15-today-taps').textContent=d.taps;
    $('v15-total-taps').textContent=taps;
    const streak=getStreak(), best=getBest();
    $('v15-current').textContent='🔥 '+streak+' '+(streak===1?'day':'days');
    $('v15-best').textContent=best+' '+(best===1?'day':'days');
    $('v15-coins').textContent=getCoins();

    if(xp>=2000){
      $('v15-name').textContent='LEGENDARY';
      $('v15-progress').textContent=xp+' / 2000 XP';
      $('v15-fill').style.width='100%';
      $('v15-note').textContent='Legendary complete';
    }else{
      $('v15-name').textContent=stage.name;
      $('v15-progress').textContent=xp+' / '+stage.end+' XP';
      const pct=((xp-stage.start)/(stage.end-stage.start))*100;
      $('v15-fill').style.width=Math.max(0,Math.min(100,pct))+'%';
      $('v15-note').textContent=(stage.end-xp)+' XP to next unlock';
    }
    // Daily missions reset automatically with the UTC day.
    $('m1').textContent=(d.m1Claimed?'✅ ': '')+Math.min(10,d.taps)+'/10';
    $('m2').textContent=(d.m2Claimed?'✅ ': '')+Math.min(50,d.taps)+'/50';
    $('dailyReset15').innerHTML='Daily reset in <span id="v15-countdown">'+fmt(nextReset())+'</span> UTC';
  }
  // Wrap the existing V10 tap handler. V10 remains the source of permanent XP/taps/unlocks.
  const buddy=$('buddy');
  if(buddy && !buddy.dataset.v15daily){
    const oldTap=buddy.onclick;
    buddy.onclick=function(e){
      if(oldTap)oldTap.call(this,e);
      registerDailyActivity();
      refresh();
    };
    buddy.dataset.v15daily='1';
  }
  // Daily reset data is separate from permanent game progress.
  const reset=$('reset');
  if(reset && !reset.dataset.v15daily){
    const oldReset=reset.onclick;
    reset.onclick=function(e){
      if(oldReset)oldReset.call(this,e);
      localStorage.removeItem(DAILY_KEY);
      localStorage.removeItem(DAY_KEY);
      localStorage.removeItem(STREAK_KEY);
      localStorage.removeItem(BEST_KEY);
      refresh();
    };
    reset.dataset.v15daily='1';
  }
  build();
  getDaily();
  refresh();
  setInterval(refresh,1000);
  window.addEventListener('load',refresh);
})();
</script>
